        <section id="features">
            <div id="erp-container"></div>
            <div class="feature-tabs">

                <div class="feature-tab" id="feature-member">Member Management</div>
                <div class="feature-tab" id="feature-inventory">Inventory Management</div>
            </div>
            <div class="feature-cards">
                <img src="screenshots/appointment day.jpg" alt="" class="feature-card" id="appointment">
                <img src="screenshots/appointment week.jpg" alt="" class="feature-card">

                <div class="feature-tab" id="shop-products">Shop Products</div>
                <div class="feature-tab" id="enjoy-events">Enjoy Events</div>
                <div class="feature-tab" id="share-evouchers">Buy and Share eVouchers</div>
            </div>
            <div class="feature-cards">
                <div class="mobile-screenshot" id="book"><img src="screenshots/mobile/Treatment/2 Appointment.jpg" alt=""></div>
                <div class="mobile-screenshot"><img src="screenshots/mobile/Treatment/New User.jpg" alt=""></div>

                <div class="mobile-screenshot"><img src="screenshots/mobile/Booking/Select Treatment.jpg" alt=""></div>
                <div class="mobile-screenshot"><img src="screenshots/mobile/Booking/Select Time.jpg" alt=""></div>

                <div class="mobile-screenshot" id="shop"><img src="screenshots/mobile/eCommerce/Ecommerce.jpg" alt=""></div>
                <div class="mobile-screenshot"><img src="screenshots/mobile/eCommerce/Product Added.jpg" alt=""></div>
                <div class="mobile-screenshot"><img src="screenshots/mobile/eCommerce/Using points.jpg" alt=""></div>
                <div class="mobile-screenshot" id="event"><img src="screenshots/mobile/Event/Campaign List.jpg" alt=""></div>

                <div class="mobile-screenshot"><img src="screenshots/mobile/eVoucher/My Vouchers.jpg" alt=""></div>
                <div class="mobile-screenshot"><img src="screenshots/mobile/eVoucher/Transfer.jpg" alt=""></div>
            </div>
            <script>
                function loadComponent(targetId, filePath, data = {}) {
                    fetch(filePath)
                        .then((response) => response.text())
                        .then((html) => {
                            const container = document.getElementById(targetId);
                            if (!container) return;

                            container.innerHTML = html;

                            // Loop untuk mengubah isi teks atau atribut berdasarkan ID
                            Object.keys(data).forEach((id) => {
                                const element = container.querySelector(`#${id}`);
                                if (element) {
                                    const value = data[id];

                                    // Jika value berbentuk objek (misal untuk ganti src/alt/href gambar)
                                    if (typeof value === "object" && value !== null) {
                                        Object.keys(value).forEach((attr) => {
                                            element[attr] = value[attr]; // Contoh: element.src = '...'
                                        });
                                    } else {
                                        // Jika value berupa string biasa, ubah textContent
                                        element.textContent = value;
                                    }
                                }
                            });
                        })
                        .catch((err) =>
                            console.error(`Gagal memuat komponen ${filePath}:`, err),
                        );
                }
                // 2. Pemanggilan Komponen-Komponen
                loadComponent("erp-container", "reusable/explanator.html", {
                    "explanator-label": "Brand-side app",
                    "explanator-title": "ERP for Wellness Business",
                    "explanator-description":
                        "Built-in features to help you manage your business easily",
                });

                loadComponent("fabulas-container", "reusable/explanator.html", {
                    "explanator-label": "Customer-side app",
                    "explanator-title": "Customizable Mobile App",
                    "explanator-description":
                        "A feature-rich mobile app that is ready for iOS and Android",
                });
            </script>
            <style>
                #features {
                    display: flex;
                    flex-direction: column;
                    gap: 15px;
                    background-color: white;
                }
                .feature-tabs {
                    display: flex;
                    flex-direction: row;
                    gap: 10px;
                    width: 100%;
                    overflow-x: auto;
                }
                .feature-tab {
                    padding: 10px 20px;
                    border-radius: 10px;
                    background-color: #f5f5f5;
                    cursor: pointer;
                    text-wrap: nowrap;
                    transition: all 0.3s linear;
                }
                .feature-tab:hover {
                    background-color: var(--green20);
                    border-radius: 100px;
                }
                .feature-tab.active {
                    background-color: var(--green75);
                    border-radius: 100px;
                }
                .feature-cards {
                    display: flex;
                    flex-direction: row;
                    gap: 10px;
                    width: 100%;
                    height: 500px;
                    padding-right: 10px;
                    overflow-x: scroll;
                }
                .feature-card {
                    height: 100%;
                }
                .mobile-screenshot {
                    max-width: 560px;
                    min-width: 240px;
                    height: 400px;
                    aspect-ratio: 9/18;
                    padding: 20px;
                    border-radius: 20px;
                    background-image: url(backgrounds/marble.jpg);
                    background-size: cover;
                    overflow: hidden;
                }
                .mobile-screenshot img {
                    width: 100%;
                    height: auto;
                    object-fit: cover;
                    border-radius: 20px;
                }
            </style>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    // Pemetaan ID antara feature-tab dan ID target gambar/kartu
                    const tabToTargetMap = {
                        // Bagian ERP
                        "feature-appointment": "appointment",
                        "feature-member": "member",
                        "feature-inventory": "inventory",

                        // Bagian Fabulas Mobile
                        "book-appointment": "book",
                        "shop-products": "shop",
                        "enjoy-events": "event",
                        "share-evouchers": "evoucher",
                        // Catatan: Pasangkan "face-scanning" jika sudah ada ID target gambarnya nanti
                    };

                    // Menambahkan event listener ke semua .feature-tab
                    document.querySelectorAll(".feature-tab").forEach((tab) => {
                        tab.addEventListener("click", function () {
                            const targetId = tabToTargetMap[this.id];

                            if (targetId) {
                                const targetElement = document.getElementById(targetId);

                                if (targetElement) {
                                    // Scroll halus ke elemen target
                                    targetElement.scrollIntoView({
                                        behavior: "smooth",
                                        block: "nearest",
                                        inline: "start", // Cocok jika kontainer feature-cards di-scroll secara horizontal
                                    });
                                }
                            }
                        });
                    });
                });
            </script>
        </section>
    
        <!-- Container Komponen -->
        <div id="cta-container"></div>
        <div id="footer-container"></div>
        <div id="navbar-container"></div>

        <script>
            // Fungsi sederhana untuk menyisipkan HTML
            function loadComponent(targetId, filePath) {
                fetch(filePath)
                    .then((response) => response.text())
                    .then((data) => {
                        document.getElementById(targetId).innerHTML = data;
                    })
                    .catch((err) => console.error("Gagal memuat komponen:", err));
            }

            // Panggil komponen
            loadComponent("cta-container", "reusable/cta.html");
            loadComponent("footer-container", "reusable/footer.html");

            function loadNav(targetId, filePath) {
                fetch(filePath)
                    .then((response) => response.text())
                    .then((data) => {
                        // 1. Suntikkan HTML ke dalam container
                        document.getElementById(targetId).innerHTML = data;

                        // 2. Ambil elemen-elemen untuk menu mobile
                        const iconMenu = document.getElementById("icon-menu");
                        const iconClose = document.getElementById("icon-close");
                        const expanded = document.getElementById("expanded");
                        const collapsed = document.getElementById("collapsed");

                        // 3. Ambil elemen navbar desktop dan mobile untuk efek scroll
                        const desktopNav = document.getElementById("navbar");
                        const mobileNav = document.getElementById("mobile-nav");

                        // --- A. LOGIKA TRIGGER MENU MOBILE ---
                        if (iconMenu && iconClose) {
                            iconMenu.addEventListener("click", () => {
                                expanded.style.display = "flex";
                                collapsed.style.display = "none";
                            });
                            iconClose.addEventListener("click", () => {
                                expanded.style.display = "none";
                                collapsed.style.display = "flex";
                            });
                        }

                        // --- B. LOGIKA BACKGROUND SCROLL ---
                        function checkScroll() {
                            if (window.scrollY > 50) {
                                if (desktopNav) desktopNav.classList.add("scrolled");
                                if (mobileNav) mobileNav.classList.add("scrolled");
                            } else {
                                if (desktopNav) desktopNav.classList.remove("scrolled");
                                if (mobileNav) mobileNav.classList.remove("scrolled");
                            }
                        }

                        // Jalankan saat pengguna melakukan scroll
                        window.addEventListener("scroll", checkScroll);

                        // Jalankan sekali saat halaman pertama kali dimuat (jika halaman di-refresh di posisi tengah)
                        checkScroll();
                    })
                    .catch((err) => console.error("Gagal memuat navbar:", err));
            }

            // Panggil fungsi seperti biasa
            loadNav("navbar-container", "reusable/navbar.html");
        </script>
