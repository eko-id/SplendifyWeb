            <div class="form-card" aria-labelledby="lead-form-heading">
                <div class="form-title">
                    <h2 class="heading-2">Request a consultation</h2>
                    <p class="body-3">All fields are required.</p>
                </div>
                <form id="lead-form" novalidate>
                    <div class="field"><label for="painPoint">My biggest pain point is</label><select id="painPoint" name="painPoint" required><option value="">Choose an option</option><option>Want to generate more customer leads</option><option>Problem setting appointments and converting to show-ups</option><option>Want to create engaging social media posts and videos</option><option>Need help with other digital marketing services</option><option>Have an existing agency but are looking to change</option><option>Interested in Splendify products or services</option></select><span class="field-error" id="painPoint-error"></span></div>
                    <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required maxlength="200" placeholder="Enter your name"><span class="field-error" id="name-error"></span></div>
                    <div class="field"><label for="workEmail">Work email</label><input id="workEmail" name="workEmail" type="email" autocomplete="email" required maxlength="200" placeholder="Enter your email"><span class="field-error" id="workEmail-error"></span></div>
                    <div class="field"><label for="company">Company</label><input id="company" name="company" autocomplete="organization" required maxlength="200" placeholder="Your company name"><span class="field-error" id="company-error"></span></div>
                    <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="40" placeholder="e.g. +65 8123 4567"><span class="field-error" id="phone-error"></span></div>
                    <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
                    <button id="submit-button" type="submit">Send enquiry</button>
                </form>
                <style>
                    .form-card {
                        display: flex;
                        flex-direction: column;
                        background: white;
                        gap: 20px;
                    }
                    form {
                        display: flex;
                        flex-direction: column;
                    }
                    .field {
                        display: grid;
                        gap: 4px;
                    }
                    label {
                        font-size: 14px;
                        font-weight: 500;
                        color: #24575a;
                    }
                    input,
                    select {
                        width: 100%;
                        padding: 12px 16px;
                        border: 1px solid #cce3e4;
                        border-radius: 14px;
                        color: #163f42;
                        background: #f8fbfb;
                    }
                    input:focus,
                    select:focus {
                        outline: 3px solid rgba(53, 192, 167, 0.22);
                        border-color: #35c0a7;
                    }
                    .field.invalid input,
                    .field.invalid select {
                        border-color: #bd3e3e;
                    }
                    .field-error {
                        min-height: 18px;
                        color: #a22e2e;
                        font-size: 13px;
                        line-height: 1.35;
                    }
                    button {
                        margin-top: 4px;
                        padding: 15px 25px;
                        border: 0;
                        border-radius: 100px;
                        background: linear-gradient(112deg, #35c0a7, #5bd9bb);
                        color: white;
                        font-size: 16px;
                        font-weight: 500;
                        cursor: pointer;
                        box-shadow: 0 8px 22px rgba(53, 192, 167, 0.23);
                    }
                    button:hover:not(:disabled) {
                        transform: translateY(-1px);
                    }
                    button:disabled {
                        cursor: wait;
                        opacity: 0.68;
                    }
                    .form-status {
                        display: none;
                        margin: 0;
                        padding: 12px 14px;
                        border-radius: 12px;
                        font-size: 14px;
                        line-height: 1.45;
                    }
                    .form-status.visible {
                        display: block;
                    }
                    .form-status.success {
                        color: #176653;
                        background: #e2f6ed;
                    }
                    .form-status.error {
                        color: #8a2929;
                        background: #fce8e8;
                    }
                </style>

        <script>
            const form = document.getElementById("lead-form");
            const button = document.getElementById("submit-button");
            const status = document.getElementById("form-status");
            let isSubmitting = false;
            function createSubmissionId() {
                if (window.crypto && typeof window.crypto.randomUUID === "function")
                    return window.crypto.randomUUID();
                const bytes = new Uint8Array(16);
                if (window.crypto && typeof window.crypto.getRandomValues === "function")
                    window.crypto.getRandomValues(bytes);
                else
                    for (let index = 0; index < bytes.length; index += 1)
                        bytes[index] = Math.floor(Math.random() * 256);
                bytes[6] = (bytes[6] & 0x0f) | 0x40;
                bytes[8] = (bytes[8] & 0x3f) | 0x80;
                const hex = [...bytes]
                    .map((byte) => byte.toString(16).padStart(2, "0"))
                    .join("");
                return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
            }
            let submissionId = createSubmissionId();
            const fieldNames = ["painPoint", "name", "workEmail", "company", "phone"];
            function setStatus(message, type) {
                status.textContent = message;
                status.className = `form-status visible ${type}`;
            }
            function clearErrors() {
                fieldNames.forEach((name) => {
                    const field = document.getElementById(name);
                    field.closest(".field").classList.remove("invalid");
                    document.getElementById(`${name}-error`).textContent = "";
                });
            }
            function showErrors(errors) {
                Object.entries(errors).forEach(([name, message]) => {
                    const field = document.getElementById(name);
                    if (!field) return;
                    field.closest(".field").classList.add("invalid");
                    document.getElementById(`${name}-error`).textContent = message;
                });
            }
            function validateClient(data) {
                const errors = {};
                fieldNames.forEach((name) => {
                    if (!data[name].trim()) errors[name] = "This field is required.";
                });
                if (data.workEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.workEmail))
                    errors.workEmail = "Enter a valid email address.";
                if (
                    data.phone &&
                    (!/^[0-9+().\-\s]+$/.test(data.phone) ||
                        (data.phone.match(/\d/g) || []).length < 6)
                )
                    errors.phone = "Enter a valid phone number.";
                return errors;
            }
            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                if (isSubmitting) return;
                clearErrors();
                status.className = "form-status";
                const data = {
                    ...Object.fromEntries(new FormData(form).entries()),
                    submissionId,
                };
                const errors = validateClient(data);
                if (Object.keys(errors).length) {
                    showErrors(errors);
                    setStatus("Please check the highlighted fields.", "error");
                    document.getElementById(Object.keys(errors)[0]).focus();
                    return;
                }
                isSubmitting = true;
                button.disabled = true;
                button.textContent = "Sending…";
                form.setAttribute("aria-busy", "true");
                try {
                    const response = await fetch("api/lead-submission.php", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data),
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        if (result.errors) showErrors(result.errors);
                        throw new Error(
                            result.message ||
                                "We could not save your enquiry. Please try again.",
                        );
                    }
                    window.location.href = "success.html";
                } catch (error) {
                    setStatus(
                        error.message ||
                            "We could not save your enquiry. Please try again.",
                        "error",
                    );
                } finally {
                    isSubmitting = false;
                    button.disabled = false;
                    button.textContent = "Send enquiry";
                    form.removeAttribute("aria-busy");
                }
            });
        </script>
        <!-- Container Komponen -->
        <div id="footer-container"></div>

        <script>
            // Fungsi sederhana untuk menyisipkan HTML
            function loadComponent(targetId, filePath, data = {}) {
                fetch(filePath)
                    .then((response) => response.text())
                    .then((html) => {
                        const container = document.getElementById(targetId);
                        if (!container) return;

                        container.innerHTML = html;

                        // Loop untuk mengubah isi teks atau atribut berdasarkan ID
                        Object.keys(data).forEach((id) => {
                            const element = container.querySelector(`#${id}`);
                            if (element) {
                                const value = data[id];

                                // Jika value berbentuk objek (misal untuk ganti src/alt/href gambar)
                                if (typeof value === "object" && value !== null) {
                                    Object.keys(value).forEach((attr) => {
                                        element[attr] = value[attr]; // Contoh: element.src = '...'
                                    });
                                } else {
                                    // Jika value berupa string biasa, ubah textContent
                                    element.textContent = value;
                                }
                            }
                        });
                    })
                    .catch((err) =>
                        console.error(`Gagal memuat komponen ${filePath}:`, err),
                    );
            }

            // Panggil komponen
            loadComponent("cta-container", "reusable/cta.html");
            loadComponent("footer-container", "reusable/footer.html");
            function loadNav(targetId, filePath) {
                fetch(filePath)
                    .then((response) => response.text())
                    .then((data) => {
                        // 1. Suntikkan HTML ke dalam container
                        document.getElementById(targetId).innerHTML = data;

                        // 2. Ambil elemen-elemen untuk menu mobile
                        const iconMenu = document.getElementById("icon-menu");
                        const iconClose = document.getElementById("icon-close");
                        const expanded = document.getElementById("expanded");
                        const collapsed = document.getElementById("collapsed");

                        // 3. Ambil elemen navbar desktop dan mobile untuk efek scroll
                        const desktopNav = document.getElementById("navbar");
                        const mobileNav = document.getElementById("mobile-nav");

                        // --- A. LOGIKA TRIGGER MENU MOBILE ---
                        if (iconMenu && iconClose) {
                            iconMenu.addEventListener("click", () => {
                                expanded.style.display = "flex";
                                collapsed.style.display = "none";
                            });
                            iconClose.addEventListener("click", () => {
                                expanded.style.display = "none";
                                collapsed.style.display = "flex";
                            });
                        }

                        // --- B. LOGIKA BACKGROUND SCROLL ---
                        function checkScroll() {
                            if (window.scrollY > 50) {
                                if (desktopNav) desktopNav.classList.add("scrolled");
                                if (mobileNav) mobileNav.classList.add("scrolled");
                            } else {
                                if (desktopNav) desktopNav.classList.remove("scrolled");
                                if (mobileNav) mobileNav.classList.remove("scrolled");
                            }
                        }

                        // Jalankan saat pengguna melakukan scroll
                        window.addEventListener("scroll", checkScroll);

                        // Jalankan sekali saat halaman pertama kali dimuat (jika halaman di-refresh di posisi tengah)
                        checkScroll();
                    })
                    .catch((err) => console.error("Gagal memuat navbar:", err));
            }

            // Panggil fungsi seperti biasa
            loadNav("navbar-container", "reusable/navbar.html");
            loadComponent("explanator", "reusable/explanator.html", {
                "explanator-label": "LET’S START A CONVERSATION",
                "explanator-title": "Tell us what your business needs next",
                "explanator-description":
                    "Share a few details and the Splendify team can better understand how to help with your customer journey, marketing, or technology needs",
            });

            loadComponent("hero", "reusable/hero.html", {
                "hero-label": "Contact Us",
                "hero-title": "Let's Discuss Your Business",
                "hero-description": "We would be very happy to help you grow your business",
                // Mengubah src gambar hero-background
                "hero-background": {
                    src: "../backgrounds/flower.jpg",
                    alt: "Hero Background", // opsional
                },
            });
        </script>
